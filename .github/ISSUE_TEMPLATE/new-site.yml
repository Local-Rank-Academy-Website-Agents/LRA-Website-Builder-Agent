name: New rank-and-rent website
description: Request a new local lead-generation website build
title: "[Site]: "
labels:
  - new-site
body:
  - type: markdown
    attributes:
      value: |
        Provide verified facts only. The builder will not invent reviews, credentials, addresses, or guarantees.
  - type: input
    id: niche
    attributes:
      label: Niche and primary service
      placeholder: Residential roofing and roof replacement
    validations:
      required: true
  - type: input
    id: market
    attributes:
      label: Primary market and service area
      placeholder: Austin, Texas and nearby communities
    validations:
      required: true
  - type: dropdown
    id: operator_status
    attributes:
      label: Operating status
      options:
        - Operating business
        - Authorized tenant or operator
        - Rank-and-rent site waiting for an operator
    validations:
      required: true
  - type: textarea
    id: phone_address
    attributes:
      label: Phone and address status
      description: State whether the phone is active or planned. For the address, choose a staffed customer-facing location, private service-area base, future address, virtual/mailbox, or none. Do not submit a private home address.
    validations:
      required: true
  - type: dropdown
    id: gbp_status
    attributes:
      label: Google Business Profile status
      options:
        - Verified and live
        - Created but pending
        - Planned later
        - None
        - Not eligible or lead-generation property
        - Unsure
    validations:
      required: true
  - type: textarea
    id: brand
    attributes:
      label: Brand and visual direction
      description: Include the name, voice, colors, asset paths, reference-site URLs or screenshots, and visual dislikes.
    validations:
      required: true
  - type: textarea
    id: pages
    attributes:
      label: Required pages, services, and locations
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Verified trust facts
      description: Licenses, insurance, reviews, experience, guarantees, certifications, and other approved claims.
    validations:
      required: true
  - type: textarea
    id: routing
    attributes:
      label: Lead routing
      description: Phone, email, form destination, CRM/webhook, required fields, and spam protection.
    validations:
      required: true
  - type: textarea
    id: technical
    attributes:
      label: Hosting and technical constraints
      description: Preferred stack, host, domain, analytics, consent, integrations, redirects, and deadlines.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I confirm the supplied business facts and claims are accurate and approved for publication.
          required: true
